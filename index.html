<html>

    <canvas id="main" width="1920" height="1200"></canvas>
    <script>
        var c = document.getElementById("main");
        var ctx = c.getContext("2d");
        var pos = 0
        ctx.moveTo(0, 0);
        ctx.lineTo(200, 100);
        ctx.stroke();
        document.addEventListener("keydown", (event) => {
            console.log(`Key pressed: ${event.key}`);

            if (event.key === "D") {
                var pos += 1;}
            if (event.key === "A") {
                var pos -= 1;
                };
    </script>
</html>
